<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G. Rupali | AI Specialist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #030014; --card-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.08); --primary: #7000ff; --secondary: #00d4ff; --accent: #ff0055; --text: #fff; --muted: #a1a1aa; }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; overflow-x: hidden; }

        .ambient-light { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 15% 50%, rgba(112,0,255,0.15), transparent 40%), radial-gradient(circle at 85% 30%, rgba(0,212,255,0.15), transparent 40%); animation: pulseLight 10s infinite alternate; }
        @keyframes pulseLight { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; background: var(--bg); transition: opacity 0.8s ease, visibility 0.8s; }
        #intro-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .intro-title { font-family: 'Space Grotesk'; font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; text-align: center; background: linear-gradient(to right, #fff, var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; opacity: 0; transform: translateY(30px); animation: fadeUp 1s forwards 0.5s; }
        .intro-sub { font-size: 1.2rem; color: var(--muted); margin-top: 20px; letter-spacing: 2px; opacity: 0; animation: fadeUp 1s forwards 1s; }
        .enter-btn { margin-top: 40px; padding: 15px 40px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; border-radius: 50px; cursor: pointer; font-family: 'Space Grotesk'; font-size: 1rem; transition: 0.3s; opacity: 0; animation: fadeUp 1s forwards 1.5s; }
        .enter-btn:hover { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 30px rgba(112,0,255,0.5); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .main-wrapper { max-width: 1300px; margin: 0 auto; padding: 100px 20px; opacity: 0; transition: opacity 1s ease 0.5s; }
        .main-wrapper.visible { opacity: 1; }
        .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .widget { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .widget:hover { transform: translateY(-8px); border-color: rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .w-profile { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(145deg, rgba(112,0,255,0.1), rgba(0,0,0,0)); }
        .w-patent { grid-column: span 2; background: linear-gradient(145deg, rgba(0,212,255,0.05), rgba(0,0,0,0)); border-color: rgba(0,212,255,0.2); }
        .w-edu { grid-column: span 2; }
        .w-skills { grid-column: span 2; }
        .w-projects { grid-column: span 4; }
        .w-internship { grid-column: span 2; background: linear-gradient(145deg, rgba(255,0,85,0.05), rgba(0,0,0,0)); border-color: rgba(255,0,85,0.2); }
        .w-certs { grid-column: span 1; }
        .w-hackathons { grid-column: span 1; }

        h2 { font-family: 'Space Grotesk'; font-size: 1.4rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        h2 i { color: var(--secondary); }

        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-bottom: 20px; box-shadow: 0 0 30px rgba(112,0,255,0.3); }
        .role-badge { background: rgba(112,0,255,0.2); color: #d8b4fe; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 15px; display: inline-block; }

        .patent-number { font-family: 'Space Grotesk'; font-size: 2.5rem; font-weight: 700; color: var(--secondary); margin: 10px 0; text-shadow: 0 0 20px rgba(0,212,255,0.4); }
        .patent-status { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,255,136,0.1); color: #00ff88; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; margin-top: 10px; }
        .inventor-list { font-size: 0.8rem; color: var(--muted); margin-top: 10px; font-style: italic; }

        .btn-pdf { display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: 600; transition: 0.3s; cursor: pointer; border: none; font-family: inherit; background: rgba(0,212,255,0.1); border: 1px solid var(--secondary); color: var(--secondary); font-size: 0.9rem; }
        .btn-pdf:hover { background: var(--secondary); color: var(--bg); transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,212,255,0.3); }

        .btn-resume { display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: 600; transition: 0.3s; cursor: pointer; border: 1px solid var(--primary); font-family: inherit; background: rgba(112,0,255,0.15); color: #d8b4fe; font-size: 0.9rem; }
        .btn-resume:hover { background: var(--primary); color: #fff; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(112,0,255,0.4); }

        .btn-cert { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 24px; border-radius: 25px; text-decoration: none; font-weight: 600; transition: 0.3s; cursor: pointer; border: 1px solid var(--accent); font-family: inherit; background: rgba(255,0,85,0.1); color: #ff7fa8; font-size: 0.85rem; }
        .btn-cert:hover { background: var(--accent); color: #fff; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,0,85,0.3); }

        .edu-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
        .edu-degree { font-weight: 600; font-size: 1rem; }
        .edu-school { color: var(--muted); font-size: 0.85rem; }

        .intern-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
        .intern-title { font-weight: 600; font-size: 1rem; }
        .intern-org { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
        .intern-duration { color: var(--secondary); font-size: 0.8rem; margin-top: 6px; }
        .intern-desc { color: var(--muted); font-size: 0.82rem; margin-top: 8px; line-height: 1.5; }

        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: rgba(255,255,255,0.05); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .tag:hover { background: var(--primary); border-color: var(--primary); }

        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .folder-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit; display: block; }
        .folder-card:hover { background: rgba(255,255,255,0.06); border-color: var(--accent); }
        .folder-icon { font-size: 2rem; color: var(--accent); margin-bottom: 15px; }

        .cert-item { background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .cert-item i { color: var(--secondary); }

        .hackathon-item { background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .hackathon-item i { color: var(--accent); }

        @media (max-width: 1024px) { .bento-grid { grid-template-columns: repeat(2, 1fr); } .w-profile, .w-patent, .w-edu, .w-skills, .w-projects, .w-internship, .w-certs, .w-hackathons { grid-column: span 2; } }
        @media (max-width: 768px) { .bento-grid { grid-template-columns: 1fr; } .w-profile, .w-patent, .w-edu, .w-skills, .w-projects, .w-internship, .w-certs, .w-hackathons { grid-column: span 1; } .intro-title { font-size: 3rem; } }
    </style>
</head>
<body>
    <div class="ambient-light"></div>
    <div id="intro-screen">
        <h1 class="intro-title">G. RUPALI</h1>
        <p class="intro-sub">AI SPECIALIST • RESEARCHER • INVENTOR</p>
        <button class="enter-btn" onclick="enterSite()">ENTER PORTFOLIO</button>
    </div>

    <div class="main-wrapper" id="main-content">
        <div class="bento-grid">
            <div class="widget w-profile" id="profile-widget"></div>
            <div class="widget w-patent" id="patent-widget"></div>
            <div class="widget w-edu" id="edu-widget"></div>
            <div class="widget w-skills" id="skills-widget"></div>
            <div class="widget w-projects" id="projects-widget"></div>
            <div class="widget w-internship" id="internship-widget"></div>
            <div class="widget w-certs" id="certs-widget"></div>
            <div class="widget w-hackathons" id="hackathons-widget"></div>
        </div>
    </div>

    <script>
const PORTFOLIO_DATA = {
    profile: {
        name: "G. Rupali",
        role: "AI Specialist | Fog Computing Researcher",
        bio: "Dynamic AI specialist excelling in Explainable AI (XAI) and classification models. Inventor of a Fog-assisted framework for plant disease detection using YOLOv8 and Grad-CAM.",
        avatar: "https://ui-avatars.com/api/?name=G+Rupali&background=7000ff&color=fff&size=256",
        resumeLink: "/G_Rupali_Resume.pdf",
        socials: [
            { icon: "fab fa-linkedin-in", link: "https://linkedin.com/in/rupali-ganesh-940a9b29", label: "LinkedIn" },
            { icon: "fab fa-github", link: "https://github.com/Rupali-byte-alt", label: "GitHub" }
        ]
    },
    patent: {
        number: "IN202641053225 A1",
        title: "Fog Assisted Explainable AI for Plant Disease Detection",
        abstract: "A distributed three-tier architecture (Mobile-Edge, Fog, Cloud) integrating YOLOv8 and Grad-CAM. Ensures efficiency, reliability, and low latency for farmers in rural environments by offloading explainability tasks to the fog layer.",
        status: "Published",
        date: "15-05-2026",
        applicants: ["SRM Institute Of Science And Technology, Ramapuram Campus", "Easwari Engineering College"],
        inventors: ["G. Rupali", "P. Lakshanya", "Athira Anish", "Dr. D. Deva Hema", "Dr. S. Visnu Dharsini", "Dr. T. Tamilselvi"],
        pdfLink: "/Patent_Fog_Assisted_Explainable_AI.pdf"
    },
    education: [
        { degree: "B.S. Data Science and Applications", school: "IIT Madras", year: "May 2029", location: "Chennai" },
        { degree: "B.Tech Computer Science", school: "SRM Institute of Science and Technology", year: "May 2028", location: "Chennai" }
    ],
    skills: ["Explainable AI (XAI)", "YOLOv8", "Grad-CAM", "Fog Computing", "Python", "SQL", "Android Development", "LLM Integration"],
    projects: [
        { title: "Krishilens Server", desc: "Backend API server handling real-time YOLOv8 inference requests.", tech: ["Python", "FastAPI", "YOLOv8"], link: "https://github.com/Rupali-byte-alt/krishilens-server" },
        { title: "Krishlens Website", desc: "Official web portal for the Krishilens agricultural AI platform.", tech: ["HTML5", "CSS3", "JavaScript"], link: "https://github.com/Rupali-byte-alt/Krishlens-website" },
        { title: "Study Planner DBMS", desc: "Full-stack academic management system with risk analysis dashboard.", tech: ["Flask", "MySQL", "Streamlit"], link: "https://github.com/Rupali-byte-alt/DBMS" },
        { title: "Study Planner App", desc: "Android application for intelligent study scheduling.", tech: ["Flutter", "Dart"], link: "https://github.com/Rupali-byte-alt/study-planner" },
        { title: "Loco Prediction", desc: "Predictive model for locomotive performance and maintenance forecasting.", tech: ["Python", "Machine Learning"], link: "https://github.com/Rupali-byte-alt/loco-prediction.git" },
        { title: "HackerRank Hackathon", desc: "Solutions and submission built for the HackerRank Orchestrate hackathon.", tech: ["Python"], link: "https://github.com/Rupali-byte-alt/hacker-rank-hackathon.git" },
        { title: "SpendWise", desc: "Expense tracking and personal finance management app.", tech: ["Python"], link: "https://github.com/Rupali-byte-alt/spendwise" },
        { title: "3D Model", desc: "3D modelling and visualization project.", tech: ["3D Modelling"], link: "https://github.com/Rupali-byte-alt/3D-model" },
        { title: "Web Scraping", desc: "Scripts for extracting and processing data from websites.", tech: ["Python", "Web Scraping"], link: "https://github.com/Rupali-byte-alt/web-scraping" },
        { title: "Peer-to-Peer Chat", desc: "Real-time peer-to-peer messaging application.", tech: ["Networking", "Sockets"], link: "https://github.com/Rupali-byte-alt/peer-to-peer-chat-" },
        { title: "ML", desc: "Machine learning experiments and models.", tech: ["Python", "Machine Learning"], link: "https://github.com/Rupali-byte-alt/ml" }
    ],
    internships: [
        {
            title: "Internship at CRIS (Southern Railways)",
            org: "Centre for Railway Information Systems, Chennai",
            desc: "Completed internship training under the guidance of the Regional General Manager, Chennai at the Centre for Railway Information Systems (CRIS), an organisation of the Ministry of Railways, Govt. of India.",
            duration: "22nd June – 20th July 2026",
            certLink: "/Chennai%20-%20G%20Rupali.pdf"
        }
    ],
    certifications: ["Cybersecurity Analyst Job Simulation", "Learn Python Programming", "A1 Certificate in German"],
    hackathons: ["AI Impact Gen-AI Hackathon – Participation", "Smart India Hackathon – Participation (Internal)", "Creonix", "HackerRank Orchestrate", "Confluence 2.0"]
};

    </script>
    <script>
        function enterSite() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('main-content').classList.add('visible');
        }

        async function downloadDocument(url, filename) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error("Direct download failed, opening in browser:", error);
                window.open(url, '_blank');
            }
        }

        function viewPatent(url) {
            downloadDocument(url, 'Patent_IN202641053225_A1.pdf');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const d = PORTFOLIO_DATA;

            document.getElementById('profile-widget').innerHTML = `
                <span class="role-badge">${d.profile.role}</span>
                <h1 style="font-family:'Space Grotesk'; font-size:2.5rem; margin-bottom:10px;">${d.profile.name}</h1>
                <p style="color:var(--muted); max-width:400px; line-height:1.6;">${d.profile.bio}</p>
                <div class="tags" style="margin-top:25px; justify-content:center;">
                    ${d.profile.socials.map(s => `<a href="${s.link}" target="_blank" class="tag"><i class="${s.icon}"></i> ${s.label}</a>`).join('')}
                </div>
                ${d.profile.resumeLink ? `
                <button onclick="downloadDocument('${d.profile.resumeLink}', 'G_Rupali_Resume.pdf')" class="btn-resume">
                    <i class="fas fa-download"></i> Download Resume
                </button>` : ''}
            `;

            document.getElementById('patent-widget').innerHTML = `
                <h2><i class="fas fa-file-contract"></i> Indian Patent Application</h2>
                <div style="text-align:center; padding:10px 0;">
                    <div class="patent-number">${d.patent.number}</div>
                    <h3 style="font-size:1.2rem; margin-bottom:10px;">${d.patent.title}</h3>
                    <p style="color:var(--muted); font-size:0.85rem; margin-bottom:15px; line-height:1.5;">${d.patent.abstract}</p>
                    <div class="patent-status"><i class="fas fa-check-circle"></i> ${d.patent.status} • ${d.patent.date}</div>
                    <div class="inventor-list">Applicants: ${d.patent.applicants.join(", ")}</div>
                    <div class="inventor-list">Inventors: ${d.patent.inventors.join(", ")}</div>
                    <button onclick="viewPatent('${d.patent.pdfLink}')" class="btn-pdf">
                        <i class="fas fa-eye"></i> View Full Patent Document
                    </button>
                </div>
            `;

            document.getElementById('edu-widget').innerHTML = `
                <h2><i class="fas fa-graduation-cap"></i> Education</h2>
                ${d.education.map(e => `
                    <div class="edu-card">
                        <div class="edu-degree">${e.degree}</div>
                        <div class="edu-school">${e.school} • ${e.year}</div>
                        <div style="font-size:0.8rem; color:var(--muted);">${e.location}</div>
                    </div>
                `).join('')}
            `;

            document.getElementById('skills-widget').innerHTML = `
                <h2><i class="fas fa-microchip"></i> Technical Skills</h2>
                <div class="tags">${d.skills.map(s => `<span class="tag">${s}</span>`).join('')}</div>
            `;

            // Every project card is a link: clicking it redirects to the GitHub repo.
            // Change target="_blank" to target="_self" to open in the same tab instead.
            document.getElementById('projects-widget').innerHTML = `
                <h2><i class="fas fa-layer-group"></i> Project Archives</h2>
                <div class="project-grid">
                    ${d.projects.map(p => `
                        <a href="${p.link}" target="_blank" rel="noopener noreferrer" class="folder-card">
                            <i class="fas fa-folder-open folder-icon"></i>
                            <h3 style="margin-bottom:8px;">${p.title}</h3>
                            <p style="color:var(--muted); font-size:0.85rem; margin-bottom:15px;">${p.desc}</p>
                            <div class="tags">${p.tech.map(t => `<span class="tag" style="font-size:0.7rem; padding:3px 8px;">${t}</span>`).join('')}</div>
                        </a>
                    `).join('')}
                </div>
            `;

            document.getElementById('internship-widget').innerHTML = `
                <h2><i class="fas fa-briefcase"></i> Internship</h2>
                ${d.internships.map(i => `
                    <div class="intern-card">
                        <div class="intern-title">${i.title}</div>
                        <div class="intern-org">${i.org}</div>
                        <div class="intern-duration"><i class="fas fa-calendar-alt"></i> ${i.duration}</div>
                        <div class="intern-desc">${i.desc}</div>
                        ${i.certLink ? `
                        <button onclick="downloadDocument('${i.certLink}', 'CRIS_Internship_Certificate.pdf')" class="btn-cert">
                            <i class="fas fa-file-download"></i> View Certificate
                        </button>` : ''}
                    </div>
                `).join('')}
            `;

            document.getElementById('certs-widget').innerHTML = `
                <h2><i class="fas fa-certificate"></i> Certifications</h2>
                ${d.certifications.map(c => `
                    <div class="cert-item"><i class="fas fa-check"></i> ${c}</div>
                `).join('')}
            `;

            document.getElementById('hackathons-widget').innerHTML = `
                <h2><i class="fas fa-trophy"></i> Hackathons</h2>
                ${d.hackathons.map(h => `
                    <div class="hackathon-item"><i class="fas fa-bolt"></i> ${h}</div>
                `).join('')}
            `;
        });
    </script>
</body>
</html>
